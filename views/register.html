<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Adopter Account | PawHaven Pet Adoption Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(15, 59, 46, 0.08) 0%, transparent 45%), #f8fafc;">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="/">
        <div class="brand-icon">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <span>Paw<span style="color: var(--accent);">Haven</span></span>
      </a>
      <div id="navbar-auth-section" class="ms-auto">
        <a href="/" class="btn btn-outline-custom py-1 px-3"><i class="bi bi-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </nav>

  <!-- Register Main Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-9 col-lg-6">
        
        <div class="glass-card p-4 p-md-5">
          
          <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
              <i class="bi bi-heart-fill fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark">Join the PawHaven Family</h3>
            <p class="text-muted small">Register to browse, apply, and track pet adoptions in real time</p>
          </div>

          <form id="register-form">
            <div class="row g-3">
              
              <!-- Full Name -->
              <div class="col-12">
                <label for="full_name" class="form-label-custom">Full Name <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                  <input type="text" class="form-control form-control-custom border-start-0" id="full_name" placeholder="e.g. Jessica Taylor" required>
                </div>
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label for="email" class="form-label-custom">Email Address <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                  <input type="email" class="form-control form-control-custom border-start-0" id="email" placeholder="name@example.com" required>
                </div>
              </div>

              <!-- Phone -->
              <div class="col-md-6">
                <label for="phone" class="form-label-custom">Phone Number</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                  <input type="tel" class="form-control form-control-custom border-start-0" id="phone" placeholder="+1 (555) 000-0000">
                </div>
              </div>

              <!-- Address -->
              <div class="col-12">
                <label for="address" class="form-label-custom">Residential Address</label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-geo-alt text-muted"></i></span>
                  <input type="text" class="form-control form-control-custom border-start-0" id="address" placeholder="123 Street Name, City, State, ZIP">
                </div>
              </div>

              <!-- Password -->
              <div class="col-md-6">
                <label for="password" class="form-label-custom">Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                  <input type="password" class="form-control form-control-custom border-start-0" id="password" placeholder="At least 6 chars" required minlength="6">
                </div>
              </div>

              <!-- Confirm Password -->
              <div class="col-md-6">
                <label for="confirm_password" class="form-label-custom">Confirm Password <span class="text-danger">*</span></label>
                <div class="input-group">
                  <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                  <input type="password" class="form-control form-control-custom border-start-0" id="confirm_password" placeholder="Re-enter password" required minlength="6">
                </div>
              </div>

              <!-- Terms checkbox -->
              <div class="col-12">
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" id="termsCheck" required checked>
                  <label class="form-check-label small text-muted" for="termsCheck">
                    I agree to the PawHaven rescue terms, ethical treatment guidelines, and adoption agreements.
                  </label>
                </div>
              </div>

              <!-- Submit button -->
              <div class="col-12 mt-4">
                <button type="submit" class="btn btn-primary-custom w-100 py-2" id="register-btn">
                  <span>Create Account & Start Adopting</span> <i class="bi bi-arrow-right"></i>
                </button>
              </div>

            </div>
          </form>

          <div class="text-center mt-4">
            <p class="small text-muted mb-0">
              Already have an account? 
              <a href="/login" class="fw-bold text-success">Sign In here</a>
            </p>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const fullName = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const address = document.getElementById('address').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirm_password').value;
      const btn = document.getElementById('register-btn');

      if (password !== confirmPassword) {
        App.showToast('Passwords do not match. Please verify.', 'danger');
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Creating Account...`;

      try {
        const res = await App.fetchApi('/api/auth/register', {
          method: 'POST',
          body: JSON.stringify({
            full_name: fullName,
            email,
            phone,
            address,
            password
          })
        });

        App.setSession(res.token, res.user);
        App.showToast('Account created! Welcome to PawHaven.', 'success');

        setTimeout(() => {
          window.location.href = '/dashboard';
        }, 600);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<span>Create Account & Start Adopting</span> <i class="bi bi-arrow-right"></i>`;
        App.showToast(err.message || 'Registration failed.', 'danger');
      }
    });
  </script>
</body>
</html>
