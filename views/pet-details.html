<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Profile | PawHaven Pet Adoption Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="/">
        <div class="brand-icon">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <span>Paw<span style="color: var(--accent);">Haven</span></span>
      </a>
      
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarMain">
        <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link nav-link-custom" href="/">Home</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom active" href="/pets">Adopt a Pet</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="/about">About Us</a></li>
          <li class="nav-item"><a class="nav-link nav-link-custom" href="/contact">Contact</a></li>
        </ul>
        <div id="navbar-auth-section">
          <div class="spinner-border spinner-border-sm text-secondary" role="status"></div>
        </div>
      </div>
    </div>
  </nav>

  <!-- Pet Details Container -->
  <div class="container py-5 flex-grow-1" id="pet-container">
    <div class="text-center py-5">
      <div class="spinner-border text-primary" role="status"></div>
      <p class="text-muted mt-2">Loading pet details...</p>
    </div>
  </div>

  <!-- Footer -->
  <footer class="footer-custom">
    <div class="container text-center small text-secondary">
      <p class="mb-0">© 2026 PawHaven Pet Adoption Portal. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const petId = urlParams.get('id');

    async function loadPetDetails() {
      const container = document.getElementById('pet-container');

      if (!petId) {
        container.innerHTML = `
          <div class="text-center py-5">
            <h4 class="text-danger">No Pet Selected</h4>
            <a href="/pets" class="btn btn-outline-custom mt-3">Browse Pets</a>
          </div>
        `;
        return;
      }

      try {
        const res = await App.fetchApi(`/api/pets/${petId}`);
        const pet = res.data;
        const userApp = res.userApplication;

        document.title = `${pet.name} (${pet.breed}) | PawHaven`;

        container.innerHTML = `
          <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
              <li class="breadcrumb-item"><a href="/">Home</a></li>
              <li class="breadcrumb-item"><a href="/pets">Pets</a></li>
              <li class="breadcrumb-item active" aria-current="page">${pet.name}</li>
            </ol>
          </nav>

          ${
            userApp
              ? `
              <div class="alert alert-${userApp.status === 'Approved' ? 'success' : userApp.status === 'Pending' ? 'warning' : 'danger'} d-flex align-items-center gap-3 mb-4 shadow-sm" role="alert">
                <i class="bi bi-info-circle-fill fs-4"></i>
                <div>
                  <strong>Application Notice:</strong> You submitted an adoption application for ${pet.name} on ${new Date(userApp.applied_at).toLocaleDateString()}. Current Status: <span class="badge bg-${userApp.status === 'Approved' ? 'success' : userApp.status === 'Pending' ? 'warning text-dark' : 'danger'}">${userApp.status}</span>.
                  <a href="/dashboard" class="alert-link ms-2">View in Dashboard &rarr;</a>
                </div>
              </div>
              `
              : ''
          }

          <div class="row g-5">
            <!-- Left: Pet Photo Card -->
            <div class="col-lg-6">
              <div class="glass-card overflow-hidden position-relative">
                <img src="${pet.image}" alt="${pet.name}" class="img-fluid w-100" style="height: 480px; object-fit: cover;" onerror="this.src='/images/pets/default.jpg'">
                <span class="pet-badge-status ${pet.status === 'Available' ? 'badge-available' : 'badge-adopted'} position-absolute top-0 end-0 m-3 fs-6">
                  ${pet.status}
                </span>
                <span class="position-absolute bottom-0 start-0 m-3 px-3 py-1 rounded-pill bg-dark bg-opacity-75 text-white fw-bold">
                  ${pet.species}
                </span>
              </div>
            </div>

            <!-- Right: Pet Details & Adoption CTA -->
            <div class="col-lg-6">
              <div class="d-flex justify-content-between align-items-start mb-2">
                <div>
                  <h1 class="display-5 fw-bold text-dark mb-1">${pet.name}</h1>
                  <h5 class="text-secondary fw-semibold">${pet.breed}</h5>
                </div>
                <div class="text-end">
                  <span class="badge bg-light text-dark border p-2 px-3 rounded-pill fs-6">
                    <i class="bi bi-gender-${pet.gender.toLowerCase()} text-primary"></i> ${pet.gender}
                  </span>
                </div>
              </div>

              <!-- Quick Facts Grid -->
              <div class="row g-3 my-3">
                <div class="col-4">
                  <div class="p-3 bg-white rounded-3 border text-center">
                    <div class="text-muted small">Age</div>
                    <div class="fw-bold fs-5 text-dark">${pet.age} ${pet.age === 1 ? 'Year' : 'Years'}</div>
                  </div>
                </div>
                <div class="col-4">
                  <div class="p-3 bg-white rounded-3 border text-center">
                    <div class="text-muted small">Size</div>
                    <div class="fw-bold fs-5 text-dark">${pet.size}</div>
                  </div>
                </div>
                <div class="col-4">
                  <div class="p-3 bg-white rounded-3 border text-center">
                    <div class="text-muted small">Gender</div>
                    <div class="fw-bold fs-5 text-dark">${pet.gender}</div>
                  </div>
                </div>
              </div>

              <!-- Health Status Card -->
              <div class="p-3 bg-success bg-opacity-10 rounded-3 border border-success border-opacity-25 mb-4">
                <div class="d-flex align-items-center gap-2 mb-1">
                  <i class="bi bi-shield-fill-check text-success fs-5"></i>
                  <span class="fw-bold text-success">Health & Medical History</span>
                </div>
                <p class="mb-0 small text-dark">${pet.health_status}</p>
              </div>

              <!-- Biography -->
              <h5 class="fw-bold text-dark mb-2">About ${pet.name}</h5>
              <p class="text-secondary leading-relaxed mb-4" style="font-size: 1.05rem;">
                ${pet.description || 'This lovely pet is eagerly awaiting a kind-hearted adopter to welcome them into a forever home.'}
              </p>

              <!-- Adoption Action -->
              <div class="p-4 bg-light rounded-4 border mb-4">
                <h6 class="fw-bold text-dark mb-1">Ready to adopt ${pet.name}?</h6>
                <p class="small text-secondary mb-3">Our adoption counselor will verify your application and arrange a meet-and-greet.</p>
                
                ${
                  pet.status === 'Available'
                    ? userApp && userApp.status === 'Pending'
                      ? `<button class="btn btn-warning w-100 py-3 fw-bold" disabled>
                          <i class="bi bi-clock-history me-1"></i> Application Pending Review
                         </button>`
                      : `<a href="/apply?petId=${pet.pet_id}" class="btn btn-primary-custom w-100 py-3 fs-6">
                          <i class="bi bi-heart-fill me-1"></i> Submit Adoption Application for ${pet.name}
                         </a>`
                    : `<button class="btn btn-secondary w-100 py-3" disabled>
                        <i class="bi bi-house-check-fill me-1"></i> Already Adopted
                       </button>`
                }
              </div>

              <!-- Shelter Note -->
              <div class="d-flex align-items-center gap-2 text-muted small">
                <i class="bi bi-geo-alt"></i> Location: PawHaven Shelter Center, Wing B
              </div>

            </div>
          </div>
        `;
      } catch (err) {
        container.innerHTML = `
          <div class="text-center py-5 text-danger">
            <h4>Error Loading Pet Profile</h4>
            <p>${err.message}</p>
            <a href="/pets" class="btn btn-outline-custom mt-2">Back to Catalog</a>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadPetDetails);
  </script>
</body>
</html>
