<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | PawHaven Pet Adoption Portal</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body style="background: radial-gradient(circle at 10% 20%, rgba(245, 158, 11, 0.08) 0%, transparent 40%), radial-gradient(circle at 90% 80%, rgba(15, 59, 46, 0.08) 0%, transparent 45%), #f8fafc;">

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg navbar-custom">
    <div class="container">
      <a class="navbar-brand navbar-brand-custom" href="/">
        <div class="brand-icon">
          <i class="bi bi-heart-pulse-fill"></i>
        </div>
        <span>Paw<span style="color: var(--accent);">Haven</span></span>
      </a>
      <div id="navbar-auth-section" class="ms-auto">
        <a href="/" class="btn btn-outline-custom py-1 px-3"><i class="bi bi-arrow-left"></i> Back to Home</a>
      </div>
    </div>
  </nav>

  <!-- Login Main Container -->
  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5">
        
        <!-- Auth Card -->
        <div class="glass-card p-4 p-md-5">
          
          <div class="text-center mb-4">
            <div class="d-inline-flex p-3 rounded-circle bg-success bg-opacity-10 text-success mb-3">
              <i class="bi bi-person-lock fs-2"></i>
            </div>
            <h3 class="fw-bold text-dark">Welcome Back</h3>
            <p class="text-muted small">Sign in to manage your applications or shelter operations</p>
          </div>

          <!-- Role Toggle Tabs -->
          <ul class="nav nav-pills nav-fill mb-4 p-1 bg-light rounded-pill border" id="authTabs" role="tablist">
            <li class="nav-item" role="presentation">
              <button class="nav-link active rounded-pill fw-bold small py-2" id="tab-adopter" data-bs-toggle="pill" data-bs-target="#panel-login" type="button" onclick="setRoleMode('User')">
                <i class="bi bi-heart me-1"></i> Adopter
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button class="nav-link rounded-pill fw-bold small py-2" id="tab-admin" data-bs-toggle="pill" data-bs-target="#panel-login" type="button" onclick="setRoleMode('Admin')">
                <i class="bi bi-shield-lock me-1"></i> Shelter Admin
              </button>
            </li>
          </ul>

          <!-- One-Click Demo Credentials Box (Great for College Viva Presentation!) -->
          <div class="p-3 mb-4 rounded-3 bg-light border border-secondary border-opacity-25" id="demo-creds-box">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span class="badge bg-primary text-white"><i class="bi bi-lightning-charge-fill"></i> Viva Demo Quick-Fill</span>
              <small class="text-muted" id="role-mode-label">Mode: Adopter</small>
            </div>
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="fillDemoUser()">
                <i class="bi bi-person"></i> Adopter Demo
              </button>
              <button type="button" class="btn btn-sm btn-outline-secondary w-50" onclick="fillDemoAdmin()">
                <i class="bi bi-shield"></i> Admin Demo
              </button>
            </div>
          </div>

          <!-- Login Form -->
          <form id="login-form">
            <input type="hidden" id="expected-role" value="User">
            
            <div class="mb-3">
              <label for="email" class="form-label-custom">Email Address</label>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                <input type="email" class="form-control form-control-custom border-start-0" id="email" placeholder="name@example.com" required>
              </div>
            </div>

            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center mb-1">
                <label for="password" class="form-label-custom mb-0">Password</label>
                <a href="javascript:void(0)" onclick="App.showToast('For demo accounts, use password: user123 or admin123', 'info')" class="text-decoration-none small text-muted">Forgot?</a>
              </div>
              <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key text-muted"></i></span>
                <input type="password" class="form-control form-control-custom border-start-0" id="password" placeholder="••••••••" required>
                <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePasswordVisibility()">
                  <i class="bi bi-eye" id="pwd-eye-icon"></i>
                </button>
              </div>
            </div>

            <div class="d-grid mt-4">
              <button type="submit" class="btn btn-primary-custom py-2" id="login-submit-btn">
                <span>Sign In to Portal</span> <i class="bi bi-arrow-right"></i>
              </button>
            </div>
          </form>

          <div class="text-center mt-4">
            <p class="small text-muted mb-0">
              Don't have an account yet? 
              <a href="/register" class="fw-bold text-success">Create Adopter Account</a>
            </p>
          </div>

        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let currentRole = 'User';

    function setRoleMode(role) {
      currentRole = role;
      document.getElementById('expected-role').value = role;
      document.getElementById('role-mode-label').innerText = `Mode: ${role === 'Admin' ? 'Administrator' : 'Adopter'}`;
    }

    function fillDemoUser() {
      setRoleMode('User');
      document.getElementById('tab-adopter').classList.add('active');
      document.getElementById('tab-admin').classList.remove('active');
      document.getElementById('email').value = 'sarah@example.com';
      document.getElementById('password').value = 'user123';
      App.showToast('Loaded demo Adopter credentials: sarah@example.com / user123', 'info');
    }

    function fillDemoAdmin() {
      setRoleMode('Admin');
      document.getElementById('tab-admin').classList.add('active');
      document.getElementById('tab-adopter').classList.remove('active');
      document.getElementById('email').value = 'admin@pawhaven.com';
      document.getElementById('password').value = 'admin123';
      App.showToast('Loaded demo Admin credentials: admin@pawhaven.com / admin123', 'warning');
    }

    function togglePasswordVisibility() {
      const input = document.getElementById('password');
      const icon = document.getElementById('pwd-eye-icon');
      if (input.type === 'password') {
        input.type = 'text';
        icon.className = 'bi bi-eye-slash';
      } else {
        input.type = 'password';
        icon.className = 'bi bi-eye';
      }
    }

    // Auto-detect role from query parameter if present: /login?role=admin
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('role') === 'admin') {
      fillDemoAdmin();
    }

    // Handle form submit
    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const expectedRole = document.getElementById('expected-role').value;
      const btn = document.getElementById('login-submit-btn');

      btn.disabled = true;
      btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span> Authenticating...`;

      try {
        const res = await App.fetchApi('/api/auth/login', {
          method: 'POST',
          body: JSON.stringify({ email, password, expectedRole })
        });

        App.setSession(res.token, res.user);
        App.showToast(`Welcome back, ${res.user.fullName}!`, 'success');

        setTimeout(() => {
          const redirect = urlParams.get('redirect');
          if (redirect) {
            window.location.href = redirect;
          } else if (res.user.role === 'Admin') {
            window.location.href = '/admin';
          } else {
            window.location.href = '/dashboard';
          }
        }, 600);
      } catch (err) {
        btn.disabled = false;
        btn.innerHTML = `<span>Sign In to Portal</span> <i class="bi bi-arrow-right"></i>`;
        App.showToast(err.message || 'Login failed. Please check your credentials.', 'danger');
      }
    });
  </script>
</body>
</html>
